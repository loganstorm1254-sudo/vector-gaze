<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vector Gaze writer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
        color: #ecfdf5;
        background: #09090b;
      }
      .card {
        max-width: 28rem;
        padding: 1.25rem 1.5rem;
        border: 1px solid rgba(45, 212, 191, 0.25);
        border-radius: 1rem;
        background: rgba(24, 24, 27, 0.92);
      }
      .ok {
        color: #5eead4;
      }
      .err {
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <strong>Vector Gaze</strong>
        <p id="status">Waiting...</p>
      </div>
      <script>
      const statusEl = document.getElementById("status");
      const setStatus = (text, cls) => {
        statusEl.textContent = text;
        statusEl.className = cls || "";
      };

      const decodeB64 = (b64) => {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      };

      const putBytes = async (path, bytes, type) => {
        try {
          await fetch(path, { method: "DELETE" });
        } catch (_) {}
        const res = await fetch(path, {
          method: "PUT",
          headers: { "Content-Type": type || "application/octet-stream" },
          body: bytes,
        });
        if (!(res.ok || res.status === 201)) {
          throw new Error("PUT " + path + " -> " + res.status);
        }
      };

      const fireConsole = async (url) => {
        try {
          await fetch(url, { method: "GET", mode: "no-cors" });
        } catch (_) {}
        try {
          await fetch(url, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "",
          });
        } catch (_) {}
      };

      const writeOverlay = async (payload) => {
        const path = String(payload.path || "/resources/assets/faceOverlays/galaxy.jpg");
        const b64 = String(payload.jpegBase64 || "");
        const opacity = Number(payload.opacity);
        const flavor = Number(payload.flavor);
        if (!path.startsWith("/") || !b64) {
          throw new Error("bad payload");
        }
        const jpeg = decodeB64(b64);
        await putBytes(path, jpeg, "image/jpeg");
        try {
          await putBytes("/persistent/customFaceOverlay.jpg", jpeg, "image/jpeg");
        } catch (_) {}

        if (payload.load) {
          const op = Number.isFinite(opacity) ? opacity : 0.8;
          const fl = Number.isFinite(flavor) ? flavor : 7;
          await fireConsole("/consolevarset?key=kProcFace_CustomEyes&value=true");
          await fireConsole(
            "/consolevarset?key=kProcFace_FlavorOfGay&value=" + encodeURIComponent(String(fl)),
          );
          await fireConsole(
            "/consolevarset?key=kProcFace_CustomEyeOpacity&value=" +
              encodeURIComponent(String(op)),
          );
          await fireConsole("/consolefunccall?func=LOOK_LoadFaceOverlay&args=");
        }
      };

      const handleMessagePut = async (event) => {
        const data = event.data;
        if (!data || data.type !== "vector-gaze-put") return;
        const reply = (payload) => {
          try {
            event.source && event.source.postMessage(payload, "*");
          } catch (_) {}
        };
        try {
          await writeOverlay({
            path: data.path,
            jpegBase64: data.jpegBase64,
            opacity: data.opacity,
            flavor: data.flavor,
            load: false,
          });
          reply({
            type: "vector-gaze-put-result",
            ok: true,
            status: 200,
          });
        } catch (err) {
          reply({
            type: "vector-gaze-put-result",
            ok: false,
            error: err && err.message ? err.message : String(err),
          });
        }
      };

      window.addEventListener("message", handleMessagePut);
      try {
        parent.postMessage({ type: "vector-gaze-put-ready" }, "*");
      } catch (_) {}

      // Auto-run when opened as a top-level tab with #gaze=<json>
      (async () => {
        const hash = location.hash || "";
        if (!hash.startsWith("#gaze=")) {
          setStatus("Write helper ready on Vector.");
          return;
        }
        try {
          setStatus("Writing overlay on Vector...");
          const raw = decodeURIComponent(hash.slice("#gaze=".length));
          const payload = JSON.parse(raw);
          await writeOverlay({ ...payload, load: payload.load !== false });
          setStatus("Done - overlay written. You can close this tab.", "ok");
          try {
            if (window.opener) {
              window.opener.postMessage(
                { type: "vector-gaze-write-done", ok: true },
                "*",
              );
            }
          } catch (_) {}
          window.setTimeout(() => {
            try {
              window.close();
            } catch (_) {}
          }, 1200);
        } catch (err) {
          const msg = err && err.message ? err.message : String(err);
          setStatus("Write failed: " + msg, "err");
          try {
            if (window.opener) {
              window.opener.postMessage(
                { type: "vector-gaze-write-done", ok: false, error: msg },
                "*",
              );
            }
          } catch (_) {}
        }
      })();
    </script>
  </body>
</html>
